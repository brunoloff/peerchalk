# Flatpak manifest for PeerChalk, buildable offline as Flathub requires: every source is pinned
# here, and Rust crates are listed in *-cargo-sources.json (made by cargo_sources.py).
app-id: io.github.brunoloff.PeerChalk
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: peerchalk
finish-args:
  - --share=network # peers, the DHT and STUN/TURN servers
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'

modules:
  - name: libsodium
    sources:
      - type: archive
        url: https://download.libsodium.org/libsodium/releases/libsodium-1.0.22.tar.gz
        sha256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349

  - name: msgpack-cxx
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_INSTALL_LIBDIR=lib, -DMSGPACK_USE_BOOST=OFF, -DMSGPACK_BUILD_TESTS=OFF, -DMSGPACK_BUILD_EXAMPLES=OFF]
    sources:
      - type: archive
        url: https://github.com/msgpack/msgpack-c/releases/download/cpp-8.0.0/msgpack-cxx-8.0.0.tar.gz
        sha256: 4a3c0c0ac55ef4456c2d0b93c21b5d105aa3a8f21ef8fa9758550feaf989b92f

  - name: argon2
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS PREFIX=/app LIBRARY_REL=lib OPTTARGET=none
      - make install PREFIX=/app LIBRARY_REL=lib OPTTARGET=none
    sources:
      - type: archive
        url: https://github.com/P-H-C/phc-winner-argon2/archive/refs/tags/20190702.tar.gz
        sha256: daf972a89577f8772602bf2eb38b6a3dd3d922bf5724d45e7f9589b5e830442c

  - name: fmt
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_INSTALL_LIBDIR=lib, -DFMT_TEST=OFF, -DFMT_DOC=OFF, -DBUILD_SHARED_LIBS=ON]
    sources:
      - type: archive
        url: https://github.com/fmtlib/fmt/releases/download/11.2.0/fmt-11.2.0.zip
        sha256: 203eb4e8aa0d746c62d8f903df58e0419e3751591bb53ff971096eaa0ebd4ec3

  - name: opendht
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_INSTALL_LIBDIR=lib, -DBUILD_TESTING=OFF, -DOPENDHT_USE_PKGCONFIG=ON, -DOPENDHT_HTTP=OFF,
                  -DOPENDHT_PEER_DISCOVERY=OFF, -DOPENDHT_PROXY_CLIENT=OFF, -DOPENDHT_PROXY_SERVER=OFF,
                  -DOPENDHT_TOOLS=OFF, -DOPENDHT_EXAMPLES=OFF, -DOPENDHT_PYTHON=OFF, -DOPENDHT_C=OFF,
                  -DOPENDHT_DOWNLOAD_DEPS=OFF, -DOPENDHT_DOCUMENTATION=OFF]
    sources:
      - type: git
        url: https://github.com/savoirfairelinux/opendht.git
        commit: 621b44c8e807e9d3b98794f6b5f8101ad216fd8f # v4.4.1

  # libnice and libdatachannel carry p2p-discovery-connect's patches.
  - name: libnice
    buildsystem: simple
    build-commands:
      - patch -p1 -i p2pdc/patches/libnice-v0.1.24-p2pdc-tls.patch
      - meson setup _build --prefix=/app --libdir=lib --buildtype=release -Dcrypto-library=openssl
        -Dgupnp=disabled -Dgstreamer=disabled -Dintrospection=disabled -Dtests=disabled
        -Dexamples=disabled
      - meson install -C _build
    sources:
      - type: git
        url: https://github.com/libnice/libnice.git
        commit: af62014d520ac09c8fe1974bda1b253114c68843 # 0.1.24
      - &p2pdc
        type: git
        url: https://github.com/brunoloff/p2pdc.git
        commit: ad2c1f2b7f85f9f3bf553326e8d2334f16ff7baa
        dest: p2pdc

  - name: libdatachannel
    buildsystem: simple
    build-commands:
      - patch -p1 -i p2pdc/patches/libdatachannel-v0.23.2-p2pdc.patch
      - cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app
        -DCMAKE_INSTALL_LIBDIR=lib -DUSE_NICE=ON -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF -DNO_EXAMPLES=ON
        -DNO_TESTS=ON
      - cmake --build _build --target datachannel
      - cmake --install _build
    sources:
      - type: git
        url: https://github.com/paullouisageneau/libdatachannel.git
        commit: 9e6a13abbb6846c003d817d0387b6706466e2b03 # v0.23.2
      - *p2pdc

  # Nostr signatures and JSON for p2p-discovery-connect's Nostr, MQTT and PeerJS backends.
  - name: secp256k1
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_INSTALL_LIBDIR=lib, -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON,
                  -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON, -DSECP256K1_ENABLE_MODULE_ECDH=OFF,
                  -DSECP256K1_ENABLE_MODULE_RECOVERY=OFF, -DSECP256K1_ENABLE_MODULE_ELLSWIFT=OFF,
                  -DSECP256K1_ENABLE_MODULE_MUSIG=OFF, -DSECP256K1_BUILD_TESTS=OFF,
                  -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF, -DSECP256K1_BUILD_BENCHMARK=OFF,
                  -DSECP256K1_BUILD_EXAMPLES=OFF]
    sources:
      - type: archive
        url: https://github.com/bitcoin-core/secp256k1/archive/refs/tags/v0.7.0.tar.gz
        sha256: 073d19064f3600014750d6949b31a0c957aa7b98920fb4aaa495be07e8e7cd00

  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts: [-DJSON_BuildTests=OFF, -DJSON_Install=ON]
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/releases/download/v3.12.0/json.tar.xz
        sha256: 42f6e95cad6ec532fd372391373363b62a14af6d771056dbfc86160e6dfff7aa

  - name: yrs
    buildsystem: simple
    build-commands:
      - CARGO_HOME=$PWD/cargo cargo rustc --offline --locked --release --package yffi
        --crate-type cdylib -- -C link-arg=-Wl,-soname,libyrs.so
      - install -Dm644 tests-ffi/include/libyrs.h /app/include/libyrs.h
      - install -Dm755 target/release/libyrs.so /app/lib/libyrs.so
    sources:
      - type: git
        url: https://github.com/y-crdt/y-crdt.git
        commit: 23b7f5693bbf9e7d26340c521ee8647f79bdfba2 # v0.28.0
      - yrs-cargo-sources.json

  # PDFium comes prebuilt, as everywhere else: building it needs Chromium's toolchain.
  - name: pdfium
    buildsystem: simple
    build-commands:
      - mkdir -p /app/include/pdfium /app/share/licenses/pdfium
      - cp -r include/. /app/include/pdfium/
      - install -Dm755 lib/libpdfium.so /app/lib/libpdfium.so
      - cp -r licenses/. /app/share/licenses/pdfium/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/pdfium-linux-x64.tgz
        sha256: e1c3ce6e270cb5e0c20816b379ad9f2c1309972697c505f508de92bf5e7d6659
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/pdfium-linux-arm64.tgz
        sha256: 8b8818f2ec57d1b213d952ca6d7f0ffeca9d0110487d0e20ad83ba918bc92efa
        strip-components: 0

  - name: peerchalk
    buildsystem: simple
    build-commands:
      - CARGO_HOME=$PWD/cargo CARGO_TARGET_DIR=$PWD/math cargo build --offline --locked --release
        --lib --manifest-path src/math/engine/Cargo.toml
      - cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app
        -DBUILD_TESTING=OFF -DPEERCHALK_WERROR=OFF -DFETCHCONTENT_SOURCE_DIR_P2PDC=$PWD/p2pdc
        -DFETCHCONTENT_FULLY_DISCONNECTED=ON -DPEERCHALK_MATH_LIBRARY=$PWD/math/release/libpeerchalk_math.a
      - cmake --build _build
      - cmake --install _build
    sources:
      - type: git
        url: https://github.com/brunoloff/peerchalk.git
        tag: v@VERSION@ # filled in from VERSION for Flathub, which also wants the commit
      - *p2pdc
      - math-cargo-sources.json
