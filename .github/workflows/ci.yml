name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config meson python3-venv libglib2.0-dev \
            libssl-dev libgnutls28-dev nettle-dev libargon2-dev libfmt-dev libgtest-dev \
            libgmock-dev libgl1-mesa-dev libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libfreetype6
      - name: Restore Qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Qt
          key: qt-linux-${{ hashFiles('tools/setup.sh') }}
      - name: Install toolchains
        run: tools/setup.sh desktop
      - name: Restore dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/prefix-linux
          key: deps-linux-${{ hashFiles('deps/**', 'cmake/P2pdcSource.cmake', 'src/math/engine/**', 'tools/setup.sh') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake --workflow --preset deps
      - name: Build and test
        run: cmake --workflow --preset linux

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-venv libgl1-mesa-dev libegl1 \
            libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6
      - name: Restore Qt and Emscripten
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Qt
            .emsdk
          key: qt-web-${{ hashFiles('tools/setup.sh') }}
      - name: Install toolchains
        run: tools/setup.sh web
      - name: Restore dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/prefix-web
          key: deps-web-${{ hashFiles('deps/**', 'cmake/P2pdcSource.cmake', 'src/math/engine/**', 'tools/setup.sh') }}
      - name: Build the site
        run: deploy/web/build.sh /peerchalk/
      - name: Keep the site for publishing
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web/site

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
