name: Release builds

# Builds the installable packages and checks that each one starts. Runs on the packaging branch,
# by hand, and for version tags; a release is published only for a tag such as v0.1.0.
on:
  push:
    branches: [packaging]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config meson python3-venv libglib2.0-dev \
            libssl-dev libgnutls28-dev nettle-dev libargon2-dev libfmt-dev libgtest-dev \
            libgmock-dev libgl1-mesa-dev libegl1 libxkbcommon-dev libvulkan-dev libdbus-1-3 \
            libfontconfig1 libfreetype6 libxcb-cursor0 file
      - name: Restore Qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Qt
          key: qt-${{ matrix.runner }}-${{ hashFiles('tools/setup.sh') }}
      - name: Install toolchains
        run: tools/setup.sh desktop
      - name: Restore dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/prefix-linux
          key: deps-${{ matrix.runner }}-${{ hashFiles('deps/**', 'cmake/P2pdcSource.cmake', 'src/math/engine/**', 'tools/setup.sh') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake --workflow --preset deps
      - name: Build and test
        run: cmake --workflow --preset linux
      - name: Package
        run: deploy/linux/package.sh
      - name: Check that the packages start
        run: |
          export QT_QPA_PLATFORM=offscreen PEERCHALK_NETWORK=off APPIMAGE_EXTRACT_AND_RUN=1
          PEERCHALK_DATA_DIR=$RUNNER_TEMP/a PEERCHALK_SMOKE_TEST=$PWD/dist/screenshot-appimage-$(uname -m).png dist/*.AppImage
          mkdir -p $RUNNER_TEMP/t && tar -C $RUNNER_TEMP/t -xzf dist/*.tar.gz
          PEERCHALK_DATA_DIR=$RUNNER_TEMP/b PEERCHALK_SMOKE_TEST=$PWD/dist/screenshot-tarball-$(uname -m).png $RUNNER_TEMP/t/*/peerchalk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}
          path: dist/

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel] # Apple Silicon and Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          brew install ninja meson pkgconf autoconf automake libtool
          command -v rustup >/dev/null || { brew install rustup && rustup-init -y --no-modify-path; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Restore Qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Qt
          key: qt-${{ matrix.runner }}-${{ hashFiles('tools/setup.sh') }}
      - name: Install toolchains
        run: tools/setup.sh desktop
      - name: Restore dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/prefix-macos
          key: deps-${{ matrix.runner }}-${{ hashFiles('deps/**', 'cmake/P2pdcSource.cmake', 'src/math/engine/**', 'tools/setup.sh') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake --workflow --preset deps-macos
      - name: Build
        run: |
          cmake --preset macos
          cmake --build --preset macos
      - name: Package
        run: deploy/macos/package.sh
      - name: Check that the app starts from its disk image
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          QT_QPA_PLATFORM=offscreen PEERCHALK_NETWORK=off PEERCHALK_DATA_DIR="$RUNNER_TEMP/data"             PEERCHALK_SMOKE_TEST="$PWD/dist/screenshot-macos-$(uname -m).png"             "$RUNNER_TEMP/dmg/PeerChalk.app/Contents/MacOS/PeerChalk"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.runner }}
          path: dist/
      - name: Test
        run: ctest --preset macos

  # The AppImage on other distributions, as people would get them, with no build tools.
  linux-distributions:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:22.04', 'ubuntu:24.04', 'fedora:41', 'archlinux:latest']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-ubuntu-22.04
      - name: Install what a desktop already has
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y libgl1 libegl1 libfontconfig1 libxkbcommon0 libdbus-1-3
          elif command -v dnf >/dev/null; then
            dnf install -y mesa-libGL mesa-libEGL fontconfig libxkbcommon dbus-libs
          else
            pacman -Sy --noconfirm mesa fontconfig libxkbcommon dbus
          fi
      - name: Start the AppImage
        run: |
          chmod +x ./*.AppImage
          QT_QPA_PLATFORM=offscreen PEERCHALK_NETWORK=off APPIMAGE_EXTRACT_AND_RUN=1 \
            PEERCHALK_DATA_DIR=/tmp/data PEERCHALK_SMOKE_TEST=/tmp/screenshot.png ./*.AppImage
